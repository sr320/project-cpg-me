[project]
name = "cpgme"
version = "0.1.0"
description = "Per-species CpG O/E (germline methylation proxy) from public genome annotations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
report = ["matplotlib>=3.8", "pandas>=2.1"]

[project.scripts]
cpgme = "cpgme.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
